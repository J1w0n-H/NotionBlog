name: Test

on:
  push:
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn
      # TODO: restore --frozen-lockfile once yarn.lock is regenerated — it is
      # missing @notionhq/client and vitest, so frozen installs always failed
      # and the test step never ran. Vercel installs without --frozen-lockfile.
      - run: yarn install --non-interactive
      - run: yarn test
